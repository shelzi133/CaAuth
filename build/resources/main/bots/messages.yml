discord:
  already-bound: "✅ Твой дискорд аккаунт уже привязан к игроку: **{player}**"

  instructions: |
    **Привязка аккаунта дискорд к майнкрафту**
    
    1. На сервере выполните команду `/binding code`
    2. Скопируйте полученный код (6 символов)
    3. Отправьте этот код боту в личку
    
    После этого твой аккаунт будет привязан!

  unknown-command: "❓ Неизвестная команда. Отправьте код верификации (6 цифр) или /start для инструкций."
  code-used: "❌ Этот код уже использован. Аккаунт игрока **{player}** уже привязан."

  binding-success: |
    {#00FF00}✅ аккаунт привязан к игроку: **{player}**{#00FF00}
    Теперь вы можете играть на сервере!

  binding-error: "❌ Ошибка при привязке аккаунта, попробуйте позже."
  invalid-code: "❌ Неверный код верификации, убедитесь, что ты ввел правильный код из игры."

