plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'z'
version = '3.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "okaeri-repo"
        url = "https://repo.okaeri.cloud/releases"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    implementation "net.dv8tion:JDA:5.3.2"
    implementation "org.telegram:telegrambots:6.9.7.1"
    implementation "org.telegram:telegrambots-abilities:6.9.7.1"
    implementation "org.xerial:sqlite-jdbc:3.44.1.0"
    compileOnly 'net.luckperms:api:5.4'
    implementation("eu.okaeri:okaeri-configs-yaml-bukkit:6.1.0-beta.4")
    compileOnly("com.github.plan-player-analytics:Plan:5.8.3638")
    compileOnly 'me.clip:placeholderapi:2.11.6'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.18'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-parameters'
}

shadowJar {
    archiveBaseName.set('CaAuth')
    archiveClassifier.set('')

    relocate 'net.dv8tion.jda', 'z.caauth.libs.jda'
    relocate 'com.fasterxml.jackson', 'z.caauth.libs.jackson'
    relocate 'eu.okaeri.configs', 'z.caauth.libs.okaeri.configs'
    relocate 'revxrsal.commands', 'z.caauth.libs.lamp'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/NOTICE.txt'
}

tasks.build.dependsOn shadowJar

jar {
    archiveClassifier.set('original')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}