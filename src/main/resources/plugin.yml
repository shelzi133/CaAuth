name: CaAuth
version: '${version}'
main: z.caAuth.CaAuth
softdepend: [LuckPerms, Plan, PlaceholderAPI, SuperVanish, PremiumVanish, SkinsRestorer, CalistoBanking]
api-version: '26.3'
description: Привязка аккаунта к Discord/Telegram + переподтверждение входа

commands:
  binding:
    description: Привязка/статус привязки аккаунта
    usage: /<command> [code]
    aliases: [bind, verify]
  unbind:
    description: Отвязывает аккаунт игрока
    usage: /<command> <игрок>
  caauth:
    description: Служебные команды CaAuth
    usage: /<command> [reload|info <игрок>|ds ...|tg ...]
    aliases: [caau]
  activityplayer:
    description: Получение роли активного игрока
    usage: /<command> [игрок]
  skins:
    description: Меню скинов игрока
    usage: /<command>


permissions:
  caauth.unbind:
    description: Отвязка чужого аккаунта
    default: op
  caauth.admin:
    description: Служебные команды /caauth (reload, info, управление ботами)
    default: op
  caauth.activityplayer.self:
    description: Выдача/снятие роли активного игрока себе
    default: op
  caauth.activityplayer.other:
    description: Выдача/снятие роли активного игрока другим
    default: op
