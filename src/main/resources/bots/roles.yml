
# автоматическаяя выдача роли при привязке
enabled: false

# ид роли которую нужно выдать
role-id: ""

# --- Донат-роли ---
# Роль выдаётся только за группу LuckPerms с наивысшим weight среди тех,
# что есть у игрока. Как только группа снята (вручную, по /lp user parent
# remove, /lp user parent clear или по истечению временной группы),
# роль в Discord автоматически пересчитывается/снимается.
donate-role: false

# группы LuckPerms -> id роли в Discord.
# ключ - точное название группы в LuckPerms, значение - id роли Discord.
# можно добавлять/удалять свои группы, ничего в коде менять не нужно.
donate-groups:
  imba: ""
  slay: ""
  prime: ""

# --- Роли персонала ---
# Работает по тому же принципу, что и донат-роли: роль конкретной группы
# выдаётся только за группу с наивысшим weight. Дополнительно staff-id -
# это универсальная роль, которая выдаётся, если у игрока есть ЛЮБАЯ
# из групп персонала, и снимается, если персональских групп не осталось.
staff-role: false

# id универсальной роли для всего персонала
staff-id: ""

# группы LuckPerms персонала -> id роли в Discord за конкретную должность
staff-groups:
  helper: ""
  moder: ""
  padmin: ""


# автоматическое изменение никнейма на сервере
change-nickname: false
